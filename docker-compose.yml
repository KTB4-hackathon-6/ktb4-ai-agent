services:
  mongodb:
    image: mongo:7
    container_name: hackathon-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-contract_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: hackathon-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    depends_on:
      - mongodb
    expose:
      - "8080"
    networks:
      - app-network

  ai:
    build:
      context: ./ai
    container_name: hackathon-ai
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: hackathon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - app-network

  caddy:
    image: caddy:2
    container_name: hackathon-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    name: hackathon-network
