services:
  mongodb:
    image: mongo:7
    container_name: hackathon-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-contract_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: hackathon-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    depends_on:
      - mongodb
    expose:
      - "8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: hackathon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    name: hackathon-network
