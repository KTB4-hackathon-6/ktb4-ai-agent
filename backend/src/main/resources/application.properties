spring.application.name=ai-agent

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.session.ttl=30m

app.ai.base-url=${AI_BASE_URL:http://localhost:8000}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT:2s}
app.ai.read-timeout=${AI_READ_TIMEOUT:30s}

app.contract-extraction.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.contract-extraction.api-key=${DEEPSEEK_API_KEY:}
app.contract-extraction.model=${CHAT_MODEL:deepseek-v4-flash}
app.contract-extraction.connect-timeout=${CONTRACT_EXTRACTION_CONNECT_TIMEOUT:5s}
app.contract-extraction.read-timeout=${CONTRACT_EXTRACTION_READ_TIMEOUT:30s}

aws.region=${AWS_REGION}
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.s3.originals-prefix=${S3_ORIGINALS_PREFIX}
aws.s3.results-prefix=${S3_RESULTS_PREFIX}
aws.s3.models-prefix=${S3_MODELS_PREFIX}
aws.s3.presigned-expires-seconds=${S3_PRESIGNED_EXPIRES_SECONDS}

ocr.secret-key=${NAVER_OCR_SECRET_KEY:}
ocr.invoke-url=${NAVER_OCR_INVOKE_URL:}
ocr.lang=ko
ocr.connect-timeout=5s
ocr.read-timeout=15s

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
