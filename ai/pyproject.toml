[project]
name = "ai-agent"
version = "0.1.0"
description = "근로계약서 OCR 추출 및 근로기준법·외국인고용법 RAG 검색 모듈"
authors = [
    { name = "sehoon.kim", email = "kkkk2058@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.74",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-deepseek>=1.1.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
